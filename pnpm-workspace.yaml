packages:
  - 'packages/*'
  - 'benchmarks'

onlyBuiltDependencies:
  - '@rolldown/binding-darwin-arm64'
  - '@biomejs/biome'
  - 'esbuild'
  - 'lefthook'

catalog:
  # Build
  vite: ^8.3.4
  '@vitejs/plugin-react': ^6.1.2

  # React
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

  # Tailwind
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # State
  jotai: ^3.0.1

  # UI primitives (shadcn)
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  '@radix-ui/react-slot': ^1.4.0

  # Data
  '@uwdata/flechette': ^2.6.0

  # Validation
  zod: ^4.6.5

allowBuilds:
  '@biomejs/biome': true
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  plyr: true
