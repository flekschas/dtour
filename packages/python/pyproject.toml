[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtour"
version = "0.4.3"
description = "Guided tours through high-dimensional data — interactive WebGPU scatter in Jupyter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anywidget>=0.9.21",
  "arro3-core>=0.6.0",
  "arro3-io>=0.6.0",
  "jupyter-scatter>=0.22.3",
  "marimo>=0.21.1",
  "matplotlib>=3.10.8",
  "numpy>=2.4.2",
  "openTSNE>=1.0",
  "pyamg>=5.3",
  "pyarrow>=24.0.0",
  "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# umap-learn pulls in the numba/llvmlite native-build chain. Kept optional so the
# base install stays wheel-only; numba is floored so resolvers can't backtrack to
# the ancient pre-wheel numba 0.53 / llvmlite 0.36 (no wheels, cap at Python <3.10).
umap = [
  "umap-learn>=0.5",
  "numba>=0.61",
]
pymde = [
  "pymde>=0.1.0",
]
# cev-metrics powers the (non-default) `confusion` metric. It only ships wheels
# for Python <=3.12, so it's kept out of the base deps to keep the core install
# wheel-only on 3.13+. Install with: pip install 'dtour[cev]'
cev = [
  "cev-metrics>=0.1.5",
]
dev = [
  "umap-learn>=0.5",
  "numba>=0.61",
  "pymde>=0.1.0",
  "cev-metrics>=0.1.5",
  "matplotlib>=3.9",
  "pandas>=2.0",
  "polars>=1.38.1",
  "pytest>=9.0.2",
  "ruff>=0.15.2",
  "ty>=0.0.18",
  "jupyterlab>=4.5.5",
  "marimo>=0.20.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dtour"]
artifacts = ["src/dtour/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/notebooks/*.py" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
