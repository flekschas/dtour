name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6

      # Needed for `pnpm run lint:py`, which runs `uvx ruff`.
      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

  python:
    runs-on: ubuntu-latest
    # 3.14 is allowed to fail: some native base deps (e.g. pyamg) don't yet ship
    # cp314 wheels. It runs for visibility and turns green once upstream catches
    # up, without blocking CI.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Base (wheel-only) install across supported Pythons — no extras. The
        # umap/numba, pymde, and cev-metrics tests skip gracefully when their
        # deps are absent (these don't all ship wheels on 3.13+).
        #
        # The extra 3.12 entry installs all extras (dev + cev) so the
        # optional-dependency code paths (aligned_umap_tour, pymde, confusion)
        # are actually exercised on the one Python where every dep has wheels.
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'
            experimental: true
          - python-version: '3.12'
            mode: 'full'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: pnpm install

      # Builds packages/python/src/dtour/static/widget.js, which the widget
      # imports via anywidget's _esm.
      - name: Build
        run: pnpm run build

      - name: Test Python
        working-directory: packages/python
        run: >
          uv run --python ${{ matrix.python-version }}
          ${{ matrix.mode == 'full' && '--extra dev --extra cev' || '--no-default-groups --with pytest' }}
          pytest
